<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TV</title>
    <link rel="icon" href="/hub/icon.svg" />
    <link rel="apple-touch-icon" href="/hub/icon.svg" />
    <link rel="preload" href="/hub/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/hub/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/hub/style.css" />
    <style>
      body { padding: max(28px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom)); }
      main { max-width: 520px; margin: 0 auto; display: grid; gap: 40px; }
      header h1 { font-size: 2.4rem; }
      header .back { display: inline-block; color: var(--muted); font-size: 0.875rem; margin-bottom: 14px; }
      header p { color: var(--muted); margin-top: 6px; }
      section { display: grid; gap: 14px; }
      section h2 { font: 400 1.45rem/1.15 var(--serif); letter-spacing: -0.005em; }
      .row { display: flex; gap: 10px; }
      .row input { flex: 1; min-width: 0; }
      .tonight { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: end; }
      .tonight img, .poster-blank { width: 92px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
      .tonight h3 { font: 400 1.6rem/1.1 var(--serif); }
      .tonight p { color: var(--muted); font-size: 0.875rem; margin-top: 4px; }
      .tonight .button { margin-top: 12px; }
      .films { display: grid; gap: 2px; max-height: 340px; overflow-y: auto; }
      .films:empty { display: none; }
      .films button { display: flex; gap: 12px; align-items: center; text-align: left; padding: 8px; border: 0; border-radius: 10px; background: none; }
      .films button:active, .films button:hover { background: var(--surface-2); }
      .films img, .films .poster-blank { width: 34px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; flex: none; background: var(--surface-2); }
      .films span { color: var(--muted); }
      .yt { display: grid; gap: 12px; }
      .yt p { color: var(--muted); }
      .yt .code { font: 400 2.2rem/1 var(--serif); letter-spacing: 0.06em; color: var(--text); }
      .yt .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .yt input[type="file"] { display: none; }
      .note { min-height: 1.4em; color: var(--muted); font-size: 0.875rem; }
      .note.error { color: var(--red); }
    </style>
    <script defer src="/hub/tv.js"></script>
  </head>
  <body>
    <main>
      <header>
        <a class="back" href="/hub/">← Deck</a>
        <h1>Bedroom TV</h1>
        <p>Send something to Vitrine.</p>
      </header>

      <section aria-labelledby="tonight-title">
        <h2 id="tonight-title">Tonight</h2>
        <div class="tonight" id="tonight"><div class="poster-blank"></div><div><p>Loading tonight's film…</p></div></div>
        <input id="film-search" type="search" placeholder="Choose another film from the watchlist" autocomplete="off" />
        <div class="films" id="films"></div>
      </section>

      <section aria-labelledby="yt-title">
        <h2 id="yt-title">Your YouTube</h2>
        <div class="yt" id="yt"><p class="note">Checking…</p></div>
      </section>

      <section aria-labelledby="link-title">
        <h2 id="link-title">Play a link</h2>
        <form class="row" id="link-form">
          <input id="link" type="url" inputmode="url" placeholder="Paste a YouTube link" autocomplete="off" required />
          <button class="button primary" type="submit">Play</button>
        </form>
      </section>

      <section aria-labelledby="search-title">
        <h2 id="search-title">Search YouTube</h2>
        <form class="row" id="search-form">
          <input id="search" type="search" placeholder="A video, a song, a channel" autocomplete="off" required />
          <button class="button primary" type="submit">Search</button>
        </form>
      </section>

      <p class="note" id="note" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
