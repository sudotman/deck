<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Deck</title>
    <link rel="icon" href="/hub/icon.svg" />
    <link rel="apple-touch-icon" href="/hub/icon.svg" />
    <link rel="preload" href="/hub/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/hub/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/hub/style.css" />
    <script defer src="/hub/vendor/hls.min.js"></script>
    <script defer src="/hub/app.js"></script>
    <script defer src="/hub/enhancements.js"></script>
    <script defer src="/hub/lights.js"></script>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview"><img src="/hub/icon.svg" alt="" /><span>Deck</span></a>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <span class="led" id="host-led"></span>
        <div><strong>Media server</strong><small id="host-address"></small></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="shell">
      <header class="topbar">
        <button id="menu" class="icon-button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <div class="breadcrumb"><b id="crumb">Home</b></div>
        <div class="header-actions">
          <a href="#activity" id="job-count" class="small text-link">Activity</a>
          <span id="updated">Connecting…</span>
          <button id="refresh" class="icon-button" aria-label="Refresh data" title="Refresh data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button>
          <button id="add" class="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add media</span></button>
        </div>
      </header>
      <div id="job-strip" hidden></div>
      <main id="main" tabindex="-1">
        <div class="loading"><span class="spinner"></span> Connecting to your stack…</div>
      </main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>
    <dialog id="dialog">
      <button class="close-dialog icon-button" aria-label="Close dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
